name: Vibe Benchmark Disclosure

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: vibe-benchmark-disclosure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  disclosure:
    name: Vibe Benchmark Disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted gate code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check live benchmark disclosure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types tools/vibe-bench/src/pr-body-gate-cli.ts "${{ github.event.pull_request.number }}"
