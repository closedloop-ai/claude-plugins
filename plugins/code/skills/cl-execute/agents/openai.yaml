interface:
  display_name: "CL Execute"
  short_description: "Draft diagrammed plans and execute tickets on Desktop or CLI"
  default_prompt: "Use $cl-execute with one ClosedLoop ticket or a parent-approved coherent batch. Keep every issue as its single ticket; legacy split evidence is context only and must not launch $cl-split. Before PRODUCT_BLOCKED or a Product contact route, run Product Answer Discovery across linked PRDs, plans, comments, sibling tickets, semantic facts, prior blockers, and product/design artifacts, and route exact unresolved decisions privately when the Product contact is unavailable or out-of-office. Draft, review, upload, link, and revise the implementation plan with the repo template before execution; use $mermaid-visualizer and include Mermaid flowcharts that explain the scope of change; keep internal orchestration details out of reviewed plans. If the current sweep/session requires Daniel's personal plan approval, stop after plan upload until Daniel personally approves the exact plan. Preserve the selected Desktop or cwd-bound CLI session protocol and every readiness, approval, review, validation, visual-QA, PR-comment, PR, and merge gate."
