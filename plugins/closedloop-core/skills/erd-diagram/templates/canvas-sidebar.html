<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f6f7f9;
  --grid: #e3e6eb;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --border: #d5dae1;
  --text: #1c2330;
  --muted: #545f70;
  --faint: #8a94a3;
  --accent: #2f6fed;
  --accent-soft: rgba(47, 111, 237, 0.13);
  --pk: #a86a10;
  --fk: #2f6fed;
  --uk: #7246cf;
  --edge: #8a94a3;
  --edge-hi: #2f6fed;
  --hit: #f5c84c;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 4px 12px rgba(16, 24, 40, 0.06);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11141a;
    --grid: #1c212a;
    --surface: #1a1f27;
    --surface-2: #222833;
    --border: #2e3644;
    --text: #e4e8ee;
    --muted: #a3adbb;
    --faint: #6b7586;
    --accent: #6b9bff;
    --accent-soft: rgba(107, 155, 255, 0.17);
    --pk: #e0b25a;
    --fk: #6b9bff;
    --uk: #b69bff;
    --edge: #6b7586;
    --edge-hi: #6b9bff;
    --hit: #c99a1e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; }
code { font: 0.92em var(--mono); background: var(--surface-2); padding: 0 3px; border-radius: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; height: 100dvh; padding-top: env(safe-area-inset-top, 0px); }

/* ---------- sidebar ---------- */
#side { display: flex; flex-direction: column; min-height: 0; background: var(--surface); box-shadow: inset -1px 0 0 var(--border); position: relative; z-index: 11; }
.brand { padding: 14px 16px 10px; }
.brand strong { display: block; font-size: 14px; }
.brand span { color: var(--muted); font-size: 11.5px; }
.searchwrap { position: relative; padding: 0 12px 10px; }
#q {
  width: 100%; height: 36px; border: 0; border-radius: 8px; padding: 0 34px 0 11px;
  background: var(--surface-2); color: var(--text); font: 13.5px var(--sans);
  box-shadow: inset 0 0 0 1px var(--border); outline: none;
}
#q:focus { box-shadow: inset 0 0 0 2px var(--accent); }
#q::placeholder { color: var(--muted); }
.searchwrap kbd { position: absolute; right: 21px; top: 9px; font: 11px var(--mono); color: var(--muted); padding: 1px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--border); pointer-events: none; }
#q:not(:placeholder-shown) + kbd { display: none; }
#tree, #results { flex: 1; overflow: auto; min-height: 0; padding: 0 8px 16px; margin: 0; }
.dgroup { margin-top: 6px; }
.dhead {
  position: sticky; top: 0; z-index: 1; display: flex; align-items: baseline; gap: 6px; margin: 0;
  background: var(--surface); padding: 8px 8px 4px;
  font-size: 11px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
}
.dhead span { margin-left: auto; font-weight: 500; }
.tlist { list-style: none; margin: 0; padding: 0; }
.titem {
  display: block; width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer;
  padding: 3px 8px 3px 14px; border-radius: 6px; font: 12.5px var(--mono); color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.titem:hover { background: var(--surface-2); }
.titem[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
#results li { padding: 6px 8px; border-radius: 7px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
#results li[aria-selected="true"] { background: var(--accent-soft); }
#results .r-main { font: 12.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#results .r-main b { color: var(--accent); font-weight: 700; }
#results .r-sub { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#results .r-empty { color: var(--muted); cursor: default; }

/* ---------- canvas ---------- */
#main { position: relative; min-width: 0; overflow: hidden; }
#stage {
  position: absolute; inset: 0;
  background-color: var(--bg);
  background-image: radial-gradient(var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
#stage.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world.moving { will-change: transform; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edges path { fill: none; stroke: var(--edge); stroke-width: 1.4; opacity: 0.32; }
#edges path.hub { opacity: 0.1; }
#edges g.hi path { stroke: var(--edge-hi); opacity: 1; stroke-width: 2.2; }
body.has-sel #edges g:not(.hi) path { opacity: 0.04; }

.node {
  position: absolute; background: var(--surface); border-radius: 8px;
  box-shadow: inset 0 0 0 1px var(--border), var(--shadow);
  overflow: hidden; cursor: pointer;
}
.node .head {
  height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
  background: var(--surface-2); box-shadow: inset 0 -1px 0 var(--border);
}
.node .name { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .tbl { margin-left: auto; color: var(--muted); font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-shrink: 1; }
.node .rows { padding: 4px 0; }
.row { height: 22px; display: flex; align-items: center; padding: 0 14px 0 0; font: 12px var(--mono); white-space: nowrap; }
.row:hover { background: var(--accent-soft); }
.row .key { width: 26px; flex: none; text-align: center; font-size: 9px; font-weight: 700; letter-spacing: 0.02em; }
.row .key.pk { color: var(--pk); }
.row .key.fk { color: var(--fk); }
.row .key.uk { color: var(--uk); }
.row .col { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row.is-fk .col { color: var(--fk); }
.row .typ { margin-left: auto; padding-left: 18px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0; }
.row.hit, .row.hit:hover { background: color-mix(in srgb, var(--hit) 38%, transparent); }
.row.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 35% { background: color-mix(in srgb, var(--hit) 75%, transparent); } }
@media (prefers-reduced-motion: reduce) { .row.flash { animation: none; } }

.node.match { box-shadow: inset 0 0 0 2px var(--hit), var(--shadow); }
.node.sel { box-shadow: inset 0 0 0 2.5px var(--accent), 0 0 0 6px var(--accent-soft), var(--shadow); }
.node.near { box-shadow: inset 0 0 0 1.5px var(--edge-hi), var(--shadow); }
body.has-sel .node:not(.sel):not(.near) { opacity: 0.32; }

body.far .row > * { visibility: hidden; }
body.far .row { background-image: linear-gradient(var(--border), var(--border)); background-size: 60% 3px; background-position: 26px center; background-repeat: no-repeat; }
body.far .node .name { font-size: 26px; }
body.far .node .tbl { display: none; }

.card { background: var(--surface); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--border), var(--shadow); }
#zoom { position: absolute; z-index: 10; top: 12px; right: 12px; display: flex; align-items: center; height: 40px; padding: 0 4px; }
#zoom button { height: 32px; min-width: 32px; padding: 0 8px; border: 0; background: transparent; border-radius: 7px; cursor: pointer; font-size: 15px; }
#zoom button:hover { background: var(--surface-2); }
#zoom #zpct { font: 12px var(--mono); min-width: 52px; }
#zoom #fit { font-size: 12px; }

#panel {
  position: absolute; z-index: 9; top: 64px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: 400px; max-width: calc(100% - 24px); overflow: auto; padding: 16px 16px 24px;
  user-select: text; -webkit-user-select: text;
}
#panel h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
#panel h2 .x { margin-left: auto; border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--muted); width: 30px; height: 30px; border-radius: 7px; }
#panel h2 .x:hover { background: var(--surface-2); }
#panel .tblname { font: 12px var(--mono); color: var(--muted); margin-top: 2px; }
#panel .doc { color: var(--muted); font-size: 12px; margin: 6px 0 0; overflow-wrap: anywhere; }
#panel .doc p { margin: 0 0 6px; white-space: pre-line; }
#panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 20px 0 6px; }
.fld { padding: 7px 8px; border-radius: 7px; margin: 0 -8px; }
.fld.cur { background: var(--accent-soft); }
.fld .l1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font: 12.5px var(--mono); }
.fld .l1 .n { font-weight: 650; }
.fld .l1 .t { color: var(--muted); }
.badge { font: 700 9.5px var(--sans); padding: 1px 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px currentColor; }
.badge.pk { color: var(--pk); } .badge.fk { color: var(--fk); } .badge.uk { color: var(--uk); }
.fld .meta { font: 11px var(--mono); color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.fld details { margin-top: 3px; font-size: 11.5px; }
.fld summary { cursor: pointer; color: var(--muted); }
.fld details ul { margin: 4px 0 0; padding-left: 18px; font: 11.5px var(--mono); }
.fld details li span { color: var(--muted); font-family: var(--sans); }
.link { border: 0; background: transparent; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }
.rel { padding: 5px 0; font: 12px var(--mono); }
.rel .meta { color: var(--muted); font-size: 11px; }
.cons { font: 12px var(--mono); padding: 2px 0; color: var(--muted); }

#mini { position: absolute; z-index: 8; left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); padding: 6px; cursor: crosshair; }
#mini canvas { display: block; border-radius: 6px; }
#hint {
  position: absolute; z-index: 8; left: 236px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  color: var(--muted); font-size: 11.5px; background: var(--surface); padding: 5px 9px; border-radius: 7px;
  box-shadow: inset 0 0 0 1px var(--border); pointer-events: none;
}
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Tables">
    <div class="brand"><strong>__TITLE__</strong><span id="meta"></span></div>
    <div class="searchwrap">
      <label for="q" class="vh">Search tables and columns</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search tables and columns"
        role="combobox" aria-autocomplete="list" aria-controls="results" aria-expanded="false">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <nav id="tree" aria-label="Tables by domain"></nav>
    <ul id="results" role="listbox" aria-label="Search results" hidden></ul>
  </aside>
  <main id="main">
    <div id="stage" aria-label="Database diagram">
      <div id="world"><svg id="edges" aria-hidden="true"></svg></div>
    </div>
    <div id="zoom" class="card">
      <button id="zout" type="button" aria-label="Zoom out">−</button>
      <button id="zpct" type="button" aria-label="Zoom to 100%">100%</button>
      <button id="zin" type="button" aria-label="Zoom in">+</button>
      <button id="fit" type="button">Fit</button>
    </div>
    <aside id="panel" class="card" hidden aria-label="Table details"></aside>
    <div id="mini" class="card" aria-label="Minimap"><canvas id="minicanvas"></canvas></div>
    <div id="hint">Drag or scroll to pan · pinch or ⌘/Ctrl + scroll to zoom · click a table for details</div>
  </main>
</div>

<script id="erd-meta" type="application/json">__META__</script>
<script id="schema-data" type="application/json">__SCHEMA__</script>
<script id="layout-data" type="application/json">__LAYOUT__</script>
<script id="domain-data" type="application/json">__DOMAINS__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("schema-data").textContent);
  var LAYOUT = JSON.parse(document.getElementById("layout-data").textContent);
  var DOMAIN_MAP = JSON.parse(document.getElementById("domain-data").textContent);
  var HUBS = __HUBS__;
  var HEAD_H = 36, ROW_H = 22, ROWS_PAD = 4;
  var MIN_K = 0.04, MAX_K = 2.5, FAR_K = 0.3;
  var SVGNS = "http://www.w3.org/2000/svg";

  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), world = $("world"), svg = $("edges"), panel = $("panel");
  var q = $("q"), results = $("results"), tree = $("tree"), zpct = $("zpct"), mini = $("minicanvas");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function typeLabel(f) { return f.type + (f.list ? "[]" : "") + (f.optional ? "?" : ""); }
  function keyOf(f) { return f.pk ? "pk" : f.fk ? "fk" : f.uk ? "uk" : ""; }

  var models = {};
  DATA.models.forEach(function (m) {
    m.cols = m.fields.filter(function (f) { return f.kind !== "relation"; });
    m.colIndex = {};
    m.cols.forEach(function (f, i) { m.colIndex[f.name] = i; });
    m.box = LAYOUT.nodes[m.name];
    models[m.name] = m;
  });
  DATA.relations.forEach(function (r, i) { r.id = i; });

  // Domains: drop names that no longer exist; anything unmapped lands in "Unsorted".
  var DOMAINS = [], domainOf = {};
  DOMAIN_MAP.forEach(function (d) {
    var tables = d.tables.filter(function (t) { return models[t] && !domainOf[t]; });
    var dom = { id: d.id, name: d.name, tables: tables };
    tables.forEach(function (t) { domainOf[t] = dom; });
    if (tables.length) DOMAINS.push(dom);
  });
  var unsorted = DATA.models.map(function (m) { return m.name; }).filter(function (n) { return !domainOf[n]; });
  if (unsorted.length) {
    var u = { id: "unsorted", name: "Unsorted", tables: unsorted };
    unsorted.forEach(function (t) { domainOf[t] = u; });
    DOMAINS.push(u);
  }

  $("meta").textContent = DATA.models.length + " tables · " + DATA.relations.length + " relations · " + DATA.meta.commit;

  // ---------- doc rendering ----------
  var LIST_LINE = /^\s*([-*•]|\d+[.)])\s/;
  function normalizeDoc(text) {
    return text.split(/\n\s*\n/).map(function (p) {
      var out = "";
      p.split("\n").forEach(function (l, i) {
        if (i === 0) out = l.trim();
        else out += (LIST_LINE.test(l) ? "\n" : " ") + l.trim();
      });
      return out;
    }).filter(Boolean);
  }
  function docBlock(text) {
    var box = el("div", "doc");
    normalizeDoc(text).forEach(function (p) {
      var para = el("p");
      p.split("`").forEach(function (seg, i) {
        if (!seg) return;
        para.appendChild(i % 2 === 1 ? el("code", null, seg) : document.createTextNode(seg));
      });
      box.appendChild(para);
    });
    return box;
  }

  // ---------- nodes ----------
  var nodeEls = {}, rowEls = {};
  var frag = document.createDocumentFragment();
  DATA.models.forEach(function (m) {
    var b = m.box;
    var n = el("div", "node");
    n.style.left = b.x + "px"; n.style.top = b.y + "px";
    n.style.width = b.w + "px"; n.style.height = b.h + "px";
    n.dataset.model = m.name;
    var head = el("div", "head");
    head.appendChild(el("span", "name", m.name));
    if (m.table !== m.name) head.appendChild(el("span", "tbl", m.table));
    head.title = m.name + (m.table !== m.name ? " (" + m.table + ")" : "");
    n.appendChild(head);
    var rows = el("div", "rows");
    rowEls[m.name] = [];
    m.cols.forEach(function (f) {
      var r = el("div", "row" + (f.fk ? " is-fk" : ""));
      r.dataset.field = f.name;
      var k = keyOf(f);
      r.appendChild(el("span", "key " + k, k.toUpperCase()));
      r.appendChild(el("span", "col", f.name));
      r.appendChild(el("span", "typ", typeLabel(f)));
      r.title = f.name + ": " + typeLabel(f) + (f.column !== f.name ? "  (" + f.column + ")" : "");
      rows.appendChild(r);
      rowEls[m.name].push(r);
    });
    n.appendChild(rows);
    nodeEls[m.name] = n;
    frag.appendChild(n);
  });
  world.appendChild(frag);
  world.style.width = LAYOUT.width + "px";
  world.style.height = LAYOUT.height + "px";
  svg.setAttribute("width", LAYOUT.width);
  svg.setAttribute("height", LAYOUT.height);

  // ---------- edges ----------
  function rowY(m, fieldName) {
    var i = m.colIndex[fieldName];
    if (i == null) return m.box.y + HEAD_H / 2;
    return m.box.y + HEAD_H + ROWS_PAD + i * ROW_H + ROW_H / 2;
  }
  function oneMarker(x, y, dir, optional) {
    var a = x + dir * 8, b = x + dir * 13;
    var d = "M" + a + " " + (y - 6) + "V" + (y + 6);
    if (optional) return d + "M" + (b + dir * 4) + " " + y + "m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0";
    return d + "M" + b + " " + (y - 6) + "V" + (y + 6);
  }
  function manyMarker(x, y, dir) {
    var t = x + dir * 12;
    return "M" + t + " " + y + "L" + x + " " + (y - 6) + "M" + t + " " + y + "L" + x + " " + y +
      "M" + t + " " + y + "L" + x + " " + (y + 6) + "M" + (t + dir * 4) + " " + (y - 5) + "V" + (y + 5);
  }
  var edgeGroups = [], relsByModel = {};
  DATA.relations.forEach(function (r) {
    (relsByModel[r.child] = relsByModel[r.child] || []).push(r);
    if (r.parent !== r.child) (relsByModel[r.parent] = relsByModel[r.parent] || []).push(r);
    var p = models[r.parent], c = models[r.child];
    var py = rowY(p, r.references[0]), cy = rowY(c, r.fields[0]);
    var pb = p.box, cb = c.box, px, cx, pd, cd;
    if (r.parent === r.child) { px = pb.x + pb.w; cx = cb.x + cb.w; pd = 1; cd = 1; }
    else if (cb.x >= pb.x + pb.w) { px = pb.x + pb.w; pd = 1; cx = cb.x; cd = -1; }
    else if (cb.x + cb.w <= pb.x) { px = pb.x; pd = -1; cx = cb.x + cb.w; cd = 1; }
    else { px = pb.x + pb.w; pd = 1; cx = cb.x + cb.w; cd = 1; }
    var ps = px + pd * 18, cs = cx + cd * 18;
    var bend = Math.max(60, Math.min(260, Math.abs(cs - ps) * 0.45));
    if (pd === cd) bend = Math.max(bend, 80 + Math.abs(cy - py) * 0.08);
    var d = "M" + px + " " + py + "H" + ps + "C" + (ps + pd * bend) + " " + py + " " + (cs + cd * bend) + " " + cy + " " + cs + " " + cy + "H" + cx;
    var g = document.createElementNS(SVGNS, "g");
    var hub = HUBS[r.parent] ? " hub" : "";
    var path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "line" + hub);
    var mk = document.createElementNS(SVGNS, "path");
    mk.setAttribute("d", oneMarker(px, py, pd, r.optional) + (r.oneToOne ? oneMarker(cx, cy, cd, true) : manyMarker(cx, cy, cd)));
    mk.setAttribute("class", "marker" + hub);
    g.appendChild(path); g.appendChild(mk);
    svg.appendChild(g);
    edgeGroups[r.id] = g;
  });

  // ---------- camera ----------
  var cam = { x: 0, y: 0, k: 1 }, moveTimer = 0, anim = 0;
  function stageRect() { return stage.getBoundingClientRect(); }
  function viewport() {
    var r = stageRect();
    var right = panel.hidden ? 0 : 424;
    return { x: 0, y: 64, w: r.width - right, h: r.height - 64 };
  }
  function apply() {
    world.style.transform = "translate(" + cam.x + "px," + cam.y + "px) scale(" + cam.k + ")";
    world.classList.add("moving");
    clearTimeout(moveTimer);
    moveTimer = setTimeout(function () { world.classList.remove("moving"); }, 160);
    document.body.classList.toggle("far", cam.k < FAR_K);
    zpct.textContent = Math.round(cam.k * 100) + "%";
    var gs = 22 * cam.k;
    while (gs < 11) gs *= 2;
    stage.style.backgroundSize = gs + "px " + gs + "px";
    stage.style.backgroundPosition = cam.x + "px " + cam.y + "px";
    drawMini();
  }
  function clampK(k) { return Math.max(MIN_K, Math.min(MAX_K, k)); }
  function zoomAt(sx, sy, k) {
    k = clampK(k);
    var wx = (sx - cam.x) / cam.k, wy = (sy - cam.y) / cam.k;
    cam.k = k; cam.x = sx - wx * k; cam.y = sy - wy * k;
    apply();
  }
  function centerOn(wx, wy, k) {
    var v = viewport();
